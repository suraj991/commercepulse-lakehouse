version: 2

models:
  - name: stg_orders
    description: "Silver orders: one row per order_id, timestamps cast."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - delivered
                  - shipped
                  - canceled
                  - unavailable
                  - invoiced
                  - processing
                  - created
                  - approved

  - name: stg_order_items
    description: "Silver order items: one row per (order_id, order_item_id)."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: seller_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: stg_order_payments
    description: "Silver payments: one row per (order_id, payment_sequential)."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_sequential
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null

  - name: stg_customers
    description: "Silver customers: one row per customer_id."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        tests:
          - not_null

  - name: stg_sellers
    description: "Silver sellers: one row per seller_id."
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: stg_products
    description: "Silver products: one row per product_id."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_product_category_translations
    description: "Portuguese ↔ English product category names."
    columns:
      - name: product_category_name
        tests:
          - unique
          - not_null
      - name: product_category_name_english
        tests:
          - not_null

  - name: stg_mql
    description: "Marketing-qualified leads: one row per mql_id."
    columns:
      - name: mql_id
        tests:
          - unique
          - not_null

  - name: stg_closed_deals
    description: "Closed seller deals: one row per mql_id."
    columns:
      - name: mql_id
        tests:
          - unique
          - not_null

  - name: stg_fx_rates
    description: >
      BRL→USD rates from Frankfurter JSON cache. Sparse until `make backfill-fx` runs.
    columns:
      - name: rate_date
        tests:
          - unique
          - not_null
      - name: brl_to_usd
        tests:
          - not_null
