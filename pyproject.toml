[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "commercepulse"
version = "0.1.0"
description = "Governed e-commerce data platform on the Olist dataset"
requires-python = ">=3.11"
dependencies = [
    # ingestion
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "boto3>=1.34",
    "minio>=7.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    # spark / iceberg
    "pyspark>=3.5",
    # dbt
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    # orchestration
    "apache-airflow>=2.9",
    # utils
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "duckdb>=0.10",
]
cloud = [
    "dbt-snowflake>=1.8",
    "awswrangler>=3.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["commercepulse", "ingestion", "lakehouse", "replay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests that require running services",
    "cloud: marks tests that require cloud credentials",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "lakehouse*", "replay*"]
